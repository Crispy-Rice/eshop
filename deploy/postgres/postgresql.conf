# ============================================================
# PostgreSQL 17 配置（生产规格）
#
# 挂载到 /etc/postgresql/postgresql.conf，由 compose 用
#   command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
# 加载。
#
# ★ 2 核 2G 的演示环境不要直接用这份 —— 用 docker-compose.demo.yml，
#   它用命令行 -c 覆盖下面几项（命令行优先级高于配置文件）：
#     shared_buffers  1GB  → 256MB
#     max_connections 100  → 50
#
# 这里只写需要显式决定的项，其余用 PG 默认值。改完用
#   docker compose exec postgres pg_reload_conf()
# 或重启容器生效（shared_buffers / shared_preload_libraries 必须重启）。
# ============================================================

# ---------- 连接 ----------
listen_addresses = '*'
# 应用侧连接池是 10+5（db_pool_size + db_max_overflow）× api 进程数 × 2（api+worker）。
# 100 对单机部署足够；演示环境降到 50（见 demo 覆盖）。
max_connections = 100
superuser_reserved_connections = 3

# ---------- 内存 ----------
# 经验值：shared_buffers 取物理内存的 25%。下面按 4GB 内存写。
shared_buffers = 1GB
# 单个排序/哈希操作的上限。仓库里的查询都是索引点查或小范围游标分页，
# 8MB 够用；设太大反而会在并发时被放大成 OOM。
work_mem = 8MB
maintenance_work_mem = 128MB
# 给查询规划器的"OS 缓存大概有多少"的提示，不实际占用内存。
# 通常取物理内存的 50%~75%。
effective_cache_size = 3GB

# ---------- WAL 与检查点 ----------
wal_level = replica
# 平滑检查点，避免周期性 I/O 尖刺
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB
# 单机部署，异步提交换来的那点性能不值得冒"提交后崩溃丢数据"的风险
synchronous_commit = on

# ---------- 超时 ----------
# 兜底：应用层已经设了 statement_timeout=5s（见 init/01-init.sh），
# 这里再兜一层，防止有人用 owner 角色绕过应用直接跑长查询。
statement_timeout = 30s
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s

# ---------- 日志 ----------
logging_collector = off          # 交给 Docker 收集 stdout
log_destination = 'stderr'
log_min_messages = warning
# 慢查询：超过 500ms 记下来，配合 pg_stat_statements 排查
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = off            # 容器内网，开了噪声太大
log_disconnections = off
log_lock_waits = on
log_temp_files = 0               # 记录所有落盘的临时文件（通常意味着 work_mem 不够）

# ---------- 扩展 ----------
# init/01-init.sh 里 CREATE EXTENSION pg_stat_statements；
# 它必须先在这里 preload，否则建扩展会报错。改了要重启容器。
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all

# ---------- 其他 ----------
timezone = 'UTC'                 # 应用全程用 UTC，库也统一，避免时区换算
# 密码用 scram-sha-256（PG 14+ 默认），不要退回 md5
password_encryption = scram-sha-256
# 中文全文检索用（docs/02 §7），装了扩展才有效；没装也不影响启动
default_text_search_config = 'pg_catalog.simple'
