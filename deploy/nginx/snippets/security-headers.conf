# 安全响应头。被 nginx.conf 的 server 块与各静态 location 复用。
#
# ★ 必须用 include 复用而不是只写在 server 块里：nginx 的 add_header 不叠加，
#   location 里一旦有任意一条 add_header，server 块的这几条就全部失效。

add_header  Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"  always;
add_header  X-Content-Type-Options    "nosniff"      always;
add_header  X-Frame-Options           "DENY"         always;
add_header  Referrer-Policy           "same-origin"  always;

# 说明两处放宽：
#   style-src 'unsafe-inline'  Element Plus 有内联样式属性，Vue 的 :style
#                              绑定也落在 style 特性上，去掉会整站错版
#   img-src   data:            前端的内联 SVG 占位图（utils/placeholder.ts）
