# 反向代理到 api 的公共参数。四个反代 location 各 include 一次。
#
# X-Request-Id 是**发过去**的：后端 request_id_middleware 读它、写进日志、
# 并在响应里回显。这样前端看到的 X-Request-Id 与 nginx/后端日志里的
# rid 是同一个值，排查一次请求能串起来。
# 因此这里不用 add_header —— 那会与后端回显的值重复。

proxy_http_version 1.1;

proxy_set_header  Host               $host;
proxy_set_header  X-Real-IP          $remote_addr;
proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header  X-Forwarded-Proto  $scheme;
proxy_set_header  X-Request-Id       $request_id;

# 配合 upstream 的 keepalive 32：清掉 Connection 才能复用长连接
proxy_set_header  Connection         "";

proxy_connect_timeout  5s;
proxy_send_timeout     60s;
proxy_read_timeout     60s;
