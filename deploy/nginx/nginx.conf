# ============================================================
# eshop 生产 nginx
#
# 路由分工（docs/16-deployment.md §4.2）：
#   /            → 商城静态文件（web-mall 构建产物）
#   /admin/      → 后台静态文件（web-admin 构建产物，构建时 base=/admin/）
#   /api/        → api:8000 反向代理
#   /media/      → 上传图片目录（/data/media，只读挂载）
#   /healthz     → api:8000（容器健康检查与发布冒烟用）
#
# 本文件被 deploy/nginx/Dockerfile 拷进镜像，不依赖宿主机挂载。
#
# ★ 关于 add_header 的一个坑：nginx 的 add_header **不叠加**，只要某个
#   location 里写了任意一条 add_header，父级（server/http）的所有 add_header
#   就都不再作用于它。所以凡是需要自定义缓存头的 location，都要重新
#   include 一次 security-headers.conf，否则那些静态响应会悄悄丢掉 CSP
#   与 nosniff —— 而静态文件恰恰是最需要 nosniff 的。
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # rid 与后端日志里的 requestId 是同一个值（见 request_id_middleware）
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rid=$request_id rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    # 不吐版本号，少一个被针对性扫描的理由
    server_tokens      off;

    # 图片上传接口单张上限 5MB（MEDIA_MAX_IMAGE_MB），留一倍余量给 multipart 边界
    client_max_body_size  10m;
    client_body_timeout   30s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/wasm image/svg+xml application/xml;

    # ---------- 限流（按 IP）----------
    # 一般接口
    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=20r/s;
    # 登录/注册/刷新令牌：单独收紧，防撞库
    limit_req_zone  $binary_remote_addr  zone=auth:10m   rate=2r/s;
    # 支付回调由渠道发起，允许突发
    limit_req_zone  $binary_remote_addr  zone=paycb:10m  rate=50r/s;
    limit_req_status 429;

    upstream eshop_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # 安全响应头对静态与反代一起生效（反代 location 里不写 add_header，
        # 所以这里能继承下去）
        include /etc/nginx/snippets/security-headers.conf;

        # ---------- 后端健康检查 ----------
        location = /healthz {
            access_log off;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass http://eshop_api;
        }
        location = /readyz {
            access_log off;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass http://eshop_api;
        }

        # ---------- 支付回调：最宽松的限流 ----------
        # nginx 前缀匹配取最长者，这条比 /api/ 长，自然优先
        location ^~ /api/payments/ {
            limit_req zone=paycb burst=100 nodelay;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass http://eshop_api;
        }

        # ---------- 登录/注册：最严的限流 ----------
        location ~ ^/api/auth/(login|register|refresh)$ {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass http://eshop_api;
        }

        # ---------- 其余接口 ----------
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass http://eshop_api;
        }

        # ---------- 上传图片 ----------
        # alias（不是 root）：/media/a.webp → /data/media/a.webp
        location /media/ {
            alias /data/media/;

            autoindex off;
            try_files $uri =404;

            # 只可能是图片。文件名是服务端生成的 uuid 且经过了重编码，
            # 这里再挡一道后缀，防止将来有人手工往卷里塞东西。
            location ~* \.(php|phtml|php[0-9]|jsp|asp|aspx|cgi|pl|py|sh|rb|html?|js|mjs|svgz)$ {
                return 403;
            }

            # 覆盖掉 server 级的安全头：图片响应不需要 CSP / XFO，
            # 但 nosniff 必须留着（少了它浏览器会嗅探内容类型）
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header Referrer-Policy "same-origin" always;
            expires 30d;
        }

        # ---------- 后台（/admin/）----------
        # 构建时 base=/admin/，index.html 与资源引用都自带前缀。
        # SPA 用 history 模式，未命中的路径回落到 /admin/index.html。
        location = /admin {
            return 301 /admin/;
        }
        location /admin/ {
            include /etc/nginx/snippets/security-headers.conf;
            # 和商城一样：index.html 绝不缓存。少了这条，发版后浏览器可能
            # 拿着旧壳去请求已经被删掉的 hash 资源，直接白屏。
            # 带 hash 的资源在 /admin/assets/ 下，被上面的正则 location 接走，
            # 不受这条影响。
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /admin/index.html;
        }

        # ---------- 带 hash 的构建产物：永久缓存 ----------
        # 放在 / 之前——正则 location 优先于前缀 location（^~ 除外）
        location ~* ^/(admin/)?assets/.+\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # ---------- 商城（/）----------
        # 前缀 location 里最短的，前面都没命中的才轮到它
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            # index.html 绝不缓存，否则发版后用户拿到旧壳去请求已删除的
            # hash 资源，白屏（docs/16 §4.2）
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
