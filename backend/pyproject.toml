[project]
name = "eshop-backend"
version = "0.1.0"
description = "多商家电商平台后端（FastAPI 模块化单体）"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "redis>=5.2",
    "arq>=0.26",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.118",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S", "ASYNC", "RUF"]
ignore = [
    "S101",    # assert：测试里要用（生产代码用显式抛异常，见 docs/05 §10）
    "B008",    # FastAPI 的 Depends() 默认参数写法
    "RUF012",  # 类属性可变默认值：SQLAlchemy 模型里常见
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
